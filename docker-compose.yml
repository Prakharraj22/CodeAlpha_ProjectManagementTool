version: '3.8'

services:
  taskpulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpulse_enterprise_saas
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=taskpulse-enterprise-super-secret-jwt-key-2026
    restart: unless-stopped
    volumes:
      - taskpulse_data:/app/server/data

volumes:
  taskpulse_data:
